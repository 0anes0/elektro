[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "elektro-cli"
dynamic = ["version"]
description = "Terminal tabanlı Elektrik-Elektronik Mühendisliği aracı"
readme = "README.md"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [{ name = "Ahmet Enes KAYMAK", email = "kaymakahmetenes@gmail.com" }]
requires-python = ">=3.9"
dependencies = [
    "typer>=0.12",
    "rich>=13.0",
    "requests>=2.28",
    "beautifulsoup4>=4.11",
]
keywords = ["electronics", "engineering", "cli", "terminal", "rf", "circuit", "datasheet"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Electronic Design Automation (EDA)",
    "Topic :: Utilities",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.urls]
Homepage = "https://github.com/0anes0/elektro"
Issues = "https://github.com/0anes0/elektro/issues"

[project.scripts]
elektro = "elektro.cli:run"

[tool.setuptools.dynamic]
version = { attr = "elektro.__version__" }

[tool.setuptools.packages.find]
include = ["elektro*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
